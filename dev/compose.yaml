name: dockercopilot-dev
services:
  backend:
    build:
      context: ..
      dockerfile: dev/Dockerfile
    ports:
      - "127.0.0.1:12712:12712"
    environment:
      secretKey: ${secretKey:?请先运行 dev.ps1 setup}
      DOCKER_HOST: unix:///var/run/docker.sock
      BACKUP_DIR: /data/backups
      TZ: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../.local/data:/data
      - ../.local/logs:/app/logs
